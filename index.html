<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Анонимная голосовая рулетка</title>
  <style>
    body {
      font-family: sans-serif;
      background: #1a1a2e;
      color: white;
      text-align: center;
      padding: 2em;
    }
    button {
      padding: 1em;
      margin: 1em;
      font-size: 1.2em;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }
    #status {
      margin-top: 2em;
      font-size: 1.1em;
    }
  </style>
</head>
<body>
  <h1>🔊 Анонимная голосовая рулетка</h1>
  <div id="tginfo">🔐 Telegram ID: неизвестен</div>
  <button id="start">🔍 Найти собеседника</button>
  <button id="stop" disabled>⛔ Завершить</button>
  <div id="status">Готов к поиску</div>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const tginfo = document.getElementById("tginfo");
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    let peer = null;
    let call = null;

    function logStatus(msg) {
      statusEl.textContent = msg;
    }

    // Получение Telegram ID
    Telegram.WebApp.ready();
    const tgUser = Telegram.WebApp.initDataUnsafe.user;
    if (tgUser && tgUser.id) {
      tginfo.textContent = `🔐 Telegram ID: ${tgUser.id}`;
    }

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      logStatus("🔎 Подключение к сети...");

      peer = new Peer();
      peer.on("open", (id) => {
        logStatus("🟢 Ваш ID: " + id);
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          call = peer.call(id, stream);
          call.on("stream", (remoteStream) => {
            const audio = new Audio();
            audio.srcObject = remoteStream;
            audio.play();
            logStatus("🎤 Вы в голосовом чате");
            stopBtn.disabled = false;
          });
        });
      });

      peer.on("call", (incomingCall) => {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          incomingCall.answer(stream);
          incomingCall.on("stream", (remoteStream) => {
            const audio = new Audio();
            audio.srcObject = remoteStream;
            audio.play();
            logStatus("🎧 Собеседник подключён");
            stopBtn.disabled = false;
          });
        });
      });
    };

    stopBtn.onclick = () => {
      if (call) call.close();
      if (peer) peer.destroy();
      logStatus("❌ Диалог завершён");
      startBtn.disabled = false;
      stopBtn.disabled = true;
    };
  </script>
</body>
</html>
