<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Анонимная голосовая рулетка</title>
  <style>
    body {
      font-family: sans-serif;
      background: #1a1a2e;
      color: white;
      text-align: center;
      padding: 2em;
    }
    button {
      padding: 1em;
      margin: 1em;
      font-size: 1.2em;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }
    #status {
      margin-top: 2em;
      font-size: 1.1em;
    }
    .spinner {
      margin-top: 10px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #fff;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin-left: auto;
      margin-right: auto;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <h1>🔊 Анонимная голосовая рулетка</h1>
  <div id="tginfo">🔐 Telegram ID: неизвестен</div>
  <button id="start">🔍 Найти собеседника</button>
  <button id="stop" disabled>⛔ Завершить</button>
  <div id="status">Готов к поиску</div>
  <div id="loader" class="spinner" style="display: none;"></div>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const tginfo = document.getElementById("tginfo");
    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const loader = document.getElementById("loader");
    let peer = null;
    let call = null;
    let matched = false;

    const SERVER_BASE = "https://6af5-95-102-48-237.ngrok-free.app";

    function logStatus(msg) {
      statusEl.textContent = msg;
    }

    function toggleLoader(show) {
      loader.style.display = show ? "block" : "none";
    }

    Telegram.WebApp.ready();
    const tgUser = Telegram.WebApp.initDataUnsafe.user;
    const tgId = tgUser?.id || null;
    if (tgId) {
      tginfo.textContent = `🔐 Telegram ID: ${tgId}`;
    }

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      logStatus("🔎 Поиск собеседника...");
      toggleLoader(true);

      peer = new Peer();

      peer.on("open", async (id) => {
        try {
          const response = await fetch(`${SERVER_BASE}/join`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ tg_id: tgId, peer_id: id })
          });

          const data = await response.json();

          if (data.status === "matched") {
            matched = true;
            logStatus("👥 Собеседник найден. Подключение...");
            toggleLoader(false);

            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const connection = peer.call(data.partner_peer_id, stream);

            connection.on("stream", (remoteStream) => {
              const audio = new Audio();
              audio.srcObject = remoteStream;
              audio.play();
              logStatus("🎤 Вы в голосовом чате");
              stopBtn.disabled = false;
              call = connection;
            });
          } else {
            logStatus("🕐 Ожидание собеседника...");
            toggleLoader(true);
          }
        } catch (err) {
          console.error(err);
          logStatus("❌ Ошибка подключения к серверу");
          toggleLoader(false);
        }
      });

      peer.on("call", async (incomingCall) => {
        if (matched) return;
        toggleLoader(false);
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        incomingCall.answer(stream);
        incomingCall.on("stream", (remoteStream) => {
          const audio = new Audio();
          audio.srcObject = remoteStream;
          audio.play();
          logStatus("🎧 Собеседник подключён");
          stopBtn.disabled = false;
          call = incomingCall;
        });
      });
    };

    stopBtn.onclick = async () => {
      if (call) call.close();
      if (peer) peer.destroy();
      logStatus("❌ Диалог завершён");
      toggleLoader(false);
      startBtn.disabled = false;
      stopBtn.disabled = true;
      matched = false;

      if (tgId) {
        await fetch(`${SERVER_BASE}/leave`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tg_id: tgId })
        });
      }
    };
  </script>
</body>
</html>
